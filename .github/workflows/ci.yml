name: CI Validation

on:
  push:
    branches:
      - main
      - ci-validation
  pull_request:
    branches:
      - main

jobs:
  python-tests:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU-only PyTorch
        run: python -m pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Install existing dependencies
        run: |
          grep -v '^torch' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt

      - name: Run pip check
        run: python -m pip check

      - name: Wait for Redis
        run: |
          for i in {1..30}; do
            if python -c "import redis; redis.Redis(host='127.0.0.1', port=6379).ping()"; then
              echo "Redis is ready"
              exit 0
            fi
            echo "Waiting for Redis..."
            sleep 1
          done
          echo "Redis did not become ready"
          exit 1

      - name: Run existing tests
        run: python -m pytest tests -v

      - name: Run isolated CI tests
        run: python -m pytest tests_ci -v

  frontend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend build
        run: npm run build